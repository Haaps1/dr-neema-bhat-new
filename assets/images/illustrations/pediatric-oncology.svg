<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t">
  <title id="t">Illustration of a child with a heart and blood cells, representing childhood cancer care</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fb6bb"/><stop offset=".5" stop-color="#2f84a0"/><stop offset="1" stop-color="#0f265d"/></linearGradient>
    <radialGradient id="rim" cx=".45" cy=".4" r=".62"><stop offset="0" stop-color="#ff8f99"/><stop offset=".7" stop-color="#e03a50"/><stop offset="1" stop-color="#9e1a31"/></radialGradient>
    <radialGradient id="pit" cx=".55" cy=".6" r=".6"><stop offset="0" stop-color="#b3243b"/><stop offset=".75" stop-color="#d4334a"/><stop offset="1" stop-color="#e03a50" stop-opacity="0"/></radialGradient>
    <radialGradient id="rimP" cx=".45" cy=".4" r=".62"><stop offset="0" stop-color="#ffe6e8"/><stop offset=".7" stop-color="#f2a9b1"/><stop offset="1" stop-color="#cf7482"/></radialGradient>
    <radialGradient id="pitP" cx=".55" cy=".6" r=".6"><stop offset="0" stop-color="#d98793"/><stop offset=".75" stop-color="#e99aa4"/><stop offset="1" stop-color="#f2a9b1" stop-opacity="0"/></radialGradient>
    <radialGradient id="wbc" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#e4eef8"/><stop offset="1" stop-color="#b9cde3"/></radialGradient>
    <radialGradient id="nuc" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#9a8fe0"/><stop offset="1" stop-color="#5a4fb3"/></radialGradient>
    <radialGradient id="plt" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#e6dcff"/><stop offset="1" stop-color="#a593e0"/></radialGradient>
    <clipPath id="sq"><rect width="400" height="400" rx="28"/></clipPath>
    <symbol id="cell" viewBox="-60 -50 120 100"><ellipse rx="56" ry="44" fill="url(#rim)"/><ellipse cx="3" cy="3" rx="31" ry="23" fill="url(#pit)"/><path d="M-40-18a46 34 0 0 1 40-20" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/></symbol>
    <symbol id="paleCell" viewBox="-60 -50 120 100"><ellipse rx="56" ry="44" fill="url(#rimP)"/><ellipse cx="3" cy="3" rx="33" ry="25" fill="url(#pitP)"/><path d="M-40-18a46 34 0 0 1 40-20" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/></symbol>
    <symbol id="white" viewBox="-60 -60 120 120"><circle r="56" fill="url(#wbc)"/><g fill="url(#nuc)"><circle cx="-14" cy="-6" r="17"/><circle cx="10" cy="-14" r="15"/><circle cx="12" cy="12" r="16"/><circle cx="-8" cy="18" r="12"/></g><path d="M-38-24a46 46 0 0 1 30-22" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/></symbol>
    <symbol id="blast" viewBox="-60 -60 120 120"><circle r="56" fill="url(#wbc)"/><circle cx="2" cy="2" r="38" fill="url(#nuc)"/><circle cx="-10" cy="-6" r="6" fill="#c9c0f5" opacity=".7"/><circle cx="12" cy="10" r="5" fill="#c9c0f5" opacity=".6"/></symbol>
    <symbol id="plasma" viewBox="-70 -50 140 100"><ellipse rx="64" ry="44" fill="url(#wbc)"/><circle cx="24" cy="2" r="26" fill="url(#nuc)"/><g fill="#c9c0f5" opacity=".75"><circle cx="16" cy="-8" r="4"/><circle cx="32" cy="-6" r="4"/><circle cx="20" cy="12" r="4"/><circle cx="34" cy="10" r="4"/></g><ellipse cx="-26" cy="0" rx="18" ry="14" fill="#dfe8f5"/></symbol>
    <symbol id="platelet" viewBox="-20 -14 40 28"><path d="M-17 2c-2-8 8-14 18-13s19 6 16 13-12 11-20 9-12-3-14-9z" fill="url(#plt)"/></symbol>
  </defs>
  <style>
    .f1{animation:f 7s ease-in-out infinite}.f2{animation:f 9s ease-in-out -3s infinite}.f3{animation:f 8s ease-in-out -5s infinite}
    @keyframes f{50%{transform:translateY(-8px)}}
    @media (prefers-reduced-motion:reduce){.f1,.f2,.f3{animation:none}}
  </style>
  <g clip-path="url(#sq)">
    <rect width="400" height="400" fill="url(#bg)"/>
    <circle cx="200" cy="200" r="160" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>
    <circle cx="200" cy="200" r="110" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="2"/>
    <g class="f1"><circle cx="200" cy="150" r="42" fill="#e8f1f8"/><path d="M120 330c0-60 36-100 80-100s80 40 80 100z" fill="#e8f1f8"/></g>
    <g class="f2"><path d="M200 300c-8-8-44-30-44-56 0-14 11-24 23-24 9 0 16 5 21 12 5-7 12-12 21-12 12 0 23 10 23 24 0 26-36 48-44 56z" fill="url(#rim)"/><path d="M174 236a14 14 0 0 1 12-8" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" opacity=".6"/></g>
    <g fill="#fff" opacity=".9" class="f3"><path d="M84 92l6 14 14 6-14 6-6 14-6-14-14-6 14-6z"/><path d="M318 120l4 9 9 4-9 4-4 9-4-9-9-4 9-4z"/></g>
    <g class="f3"><use href="#cell" x="290" y="250" width="80" height="66" transform="rotate(18 330 283)"/></g>
    <g class="f1"><use href="#white" x="40" y="240" width="70" height="70"/></g>
  </g>
</svg>
